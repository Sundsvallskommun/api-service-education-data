  responses:
    InternalServerError:
      description: Internal Error Server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            timestamp: 2025-02-18T15:57:56+01:00
            status : 500
            type: Internal Server Error
            message : An unexpected error occurred on our side. Please try again later or contact support at susa@skolverket.se if the problem persists.
    InvalidRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            timestamp: 2025-02-18T15:57:56+01:00
            status: 400
            type: Bad Request
            message: Constraint violation. 'size' must be greater than or equal to 1
    ServiceUnavailable:
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            timestamp: 2025-02-18T15:57:56+01:00
            status: 503
            type: Service Unavailable
            message: The system is currently updating education resources. Please try again later.
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            timestamp: 2025-02-18T15:57:56+01:00
            status: 404
            type: Not Found
            message: EducationEvent/Info/Provider with id 'id' not found
    NotFoundApiInfo:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            timestamp: 2025-02-18T15:57:56+01:00
            status: 404
            type: Not Found
            message: Api Info with version 'apiVersion' not found