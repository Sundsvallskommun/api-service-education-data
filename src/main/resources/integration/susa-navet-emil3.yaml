openapi: 3.0.3
info:
  version: '3.0.2'
  title: Skolverket - Susa-navets öppna API
  description: <p>Skolverkets öppna API för Susa-navet tillhandahåller information om utbildningserbjudanden, utbildningsanordnare och utbildningsinformation.<br>
    API:et erbjuder funktioner för att söka, lista och visa detaljerad information om de hanterade resurserna.<br>
    Den information som returneras är en JSON-representation av EMIL-dokument som följer EMIL 3-standarden.</p>

servers:
  - url: https://api.skolverket.se/susa-navet/emil3

tags:
  - name: Api Info
    description: Information om api
  - name: EducationEvent
    description: Information om utbildningserbjudanden
  - name: EducationInfo
    description: Information om utbildningens innehåll
  - name: EducationProvider
    description: Information om anordnare av utbildningar

paths:
  /api-info:
    get:
      tags:
        - Api Info
      summary: 'Hämta information om detta api'
      description: 'Hämta information om detta api'
      operationId: getApiInfo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfoResponse'
        '404':
          $ref: '#/components/responses/NotFoundApiInfo'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /educationEvents:
    get:
      tags:
        - EducationEvent
      summary: Hämtar en lista med utbildningstillfällen. Med möjlighet till filtering
      operationId: getEducationEvents
      parameters:
        - $ref: '#/components/parameters/schoolType'
        - $ref: '#/components/parameters/providerId'
        - $ref: '#/components/parameters/updatedSince'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationEventListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/educationEvents/{id}':
    get:
      tags:
        - EducationEvent
      summary: Hämtar information om ett utbildningstillfälle
      operationId: getEducationEvent
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationEventResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /educationProviders:
    get:
      tags:
        - EducationProvider
      summary: Hämtar en lista med utbildningsanordnare. Med möjlighet till filtering
      operationId: getEducationProviders
      parameters:
        - $ref: '#/components/parameters/schoolType'
        - $ref: '#/components/parameters/updatedSince'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationProviderListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/educationProviders/{id}':
    get:
      tags:
        - EducationProvider
      summary: Hämtar information om en utbildningsanordnare
      operationId: getEducationProvider
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationProviderResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /educationInfos:
    get:
      tags:
        - EducationInfo
      summary: Hämtar en lista med utbildningar. Med möjlighet till filtering
      operationId: getEducationInfos
      parameters:
        - $ref: '#/components/parameters/schoolType'
        - $ref: '#/components/parameters/updatedSince'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationInfoListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/educationInfos/{id}':
    get:
      tags:
        - EducationInfo
      summary: Hämtar information om en utbildning
      operationId: getEducationInfo
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationInfoResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    schoolType:
      name: schoolType
      in: query
      description: |
        Begränsa urvalet till de resurser som har en eller flera av de angivna skolformerna.  
        Tillåtna värden:

        <small>
          - **AU** – Annan undervisning  
          - **AUB** – Arbetsmarknadsutbildning  
          - **FHS** – Folkhögskola  
          - **FKLASS** – Förskoleklass  
          - **FTH** – Fritidshem  
          - **GR** – Grundskola  
          - **GRAN** – Anpassad grundskola  
          - **GY** – Gymnasieskola  
          - **GYAN** – Anpassad gymnasieskola  
          - **HS** – Högskola  
          - **KKU** – Konst- och kulturutbildning  
          - **KU** – Kulturskola  
          - **NY** – Nationell yrkesutbildning  
          - **OPPFTH** – Öppen fritidsverksamhet  
          - **SAM** – Sameskola  
          - **SP** – Specialskola  
          - **STF** – Studieförbund  
          - **VUX** – Kommunal vuxenutbildning  
          - **VUXGR** – Kommunal vuxenutbildning på grundläggande nivå  
          - **VUXGRAN** – Kommunal vuxenutbildning som anpassad utbildning på grundläggande nivå  
          - **VUXGY** – Kommunal vuxenutbildning på gymnasial nivå  
          - **VUXGYAN** – Kommunal vuxenutbildning som anpassad utbildning på gymnasial nivå  
          - **VUXSFI** – Kommunal vuxenutbildning i svenska för invandrare  
          - **YH** – Yrkeshögskola  
        </small>
      schema:
        type: array
        items:
          $ref: "#/components/schemas/SchoolTypeCode"
    providerId:
      name: providerId
      in: query
      description: identifier för provider. t.ex. "p.x.abc"
      schema:
        type: string
    updatedSince:
      name: updatedSince
      in: query
      description: |
        &nbsp;&nbsp;Endast resurser som är nya, har uppdaterats eller tagits bort vid en visst tidpunkt eller senare, t.ex. "2025-04-24" eller "2025-04-24T11:39:21".<br> 
        &nbsp;&nbsp;Om endast datum anges används midnatt som starttid, t.ex. "2025-04-24T00:00:00".<br>
      schema:
        type: string
    page:
      name: page
      in: query
      description: Används för att paginera svaret. Sidnumreringen börjar på 0.
      schema:
        type: integer
        default: 0
        minimum: 0
        example: 0
    size:
      name: size
      in: query
      description: Används för att ändra mängden resurser i svaret. Maxantalet är 2000.
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 2000
        example: 100
  schemas:
    Address:
      type: object
      properties:
        country:
          type: string
        areaCode:
          type: string
        town:
          type: string
        postalCode:
          type: string
        postBox:
          type: string
        streetAddress:
          type: string
        organization:
          $ref: '#/components/schemas/LangString'
        department:
          $ref: '#/components/schemas/LangString'
        wgs84:
          type: string
        sweref99:
          type: string
        studyLocation:
          $ref: '#/components/schemas/LangString'
    ApiErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        type:
          type: string
        message:
          type: string
    ApiInfoResponse:
      type: object
      properties:
        apiPublisher:
          type: string
          example: Skolverket
        apiName:
          type: string
          example: susa-navet
        apiVersion:
          type: string
          example: 1.0.0
        emilSchemaVersion:
          type: string
          example: 1.0.0
        apiReleased:
          type: string
          format: date
          example: 2025-10-07
        apiDocumentation:
          type: string
          example: https://www.skolverket.se/om-skolverket/webbplatser-och-tjanster/oppna-data/api-for-utbildningstillfallen-susa-navet
        apiStatus:
          type: string
          example: beta
    Application:
      type: object
      properties:
        code:
          type: string
        instruction:
          $ref: '#/components/schemas/LangString'
        url:
          $ref: '#/components/schemas/LangUrl'
        first:
          type: string
          format: date
        last:
          type: string
          format: date
        email:
          type: string
          format: email
        address:
          $ref: '#/components/schemas/Address'
        continuous:
          type: boolean
          nullable: true
    Code_Audience:
      type: object
      required:
        - type
      properties:
        type:
          type: string
      discriminator:
        propertyName: type
        mapping:
          C_Audience: '#/components/schemas/C_Audience'
      oneOf:
        - $ref: '#/components/schemas/C_Audience'
    C_Audience:
      type: object
      required:
        - type
        - code
      properties:
        type:
          type: string
        code:
          $ref: '#/components/schemas/AudienceCode'
    AudienceCode:
      type: string
      enum:
        - rektorer
        - lärare
        - förskolelärare
        - yrkeslärare
    Code_Body:
      type: object
      required:
        - type
      properties:
        type:
          type: string
      discriminator:
        propertyName: type
        mapping:
          C_Body: '#/components/schemas/C_Body'
      oneOf:
        - $ref: '#/components/schemas/C_Body'
    C_Body:
      type: object
      required:
        - type
        - code
      properties:
        type:
          type: string
        code:
          type: string
          enum:
            - kommunal
            - region
            - statlig
            - enskild
            - annan
    Code_Configuration:
      type: object
      required:
        - type
      properties:
        type:
          type: string
      discriminator:
        propertyName: type
        mapping:
          C_Configuration: '#/components/schemas/C_Configuration'
      oneOf:
        - $ref: '#/components/schemas/C_Configuration'
    C_Configuration:
      type: object
      required:
        - type
        - code
      properties:
        type:
          type: string
        code:
          $ref: '#/components/schemas/ConfigurationCode'
    ConfigurationCode:
      type: string
      enum:
        - kurs
        - kurspaket
        - program
    SchoolTypeCode:
      type: string
      description: |
        Följande värden används för att beskriva skolform:
        | Kod      | Beskrivning |
        |----------|-------------|
        | AU       | Annan undervisning |
        | AUB      | Arbetsmarknadsutbildning |
        | FHS      | Folkhögskola |
        | FKLASS   | Förskoleklass |
        | FTH      | Fritidshem |
        | GR       | Grundskola |
        | GRAN     | Anpassad grundskola |
        | GY       | Gymnasieskola |
        | GYAN     | Anpassad gymnasieskola |
        | HS       | Högskola |
        | KKU      | Konst- och Kulturutbildning |
        | KU       | Kulturskola |
        | NY       | Nationell yrkesutbildning |
        | OPPFTH   | Öppen fritidsverksamhet |
        | SAM      | Sameskola |
        | SP       | Specialskola |
        | STF      | Studieförbund |
        | VUX      | Kommunal vuxenutbildning |
        | VUXGR    | Kommunal vuxenutbildning på grundläggande nivå |
        | VUXGRAN  | Kommunal vuxenutbildning som anpassad utbildning på grundläggande nivå |
        | VUXGY    | Kommunal vuxenutbildning på gymnasial nivå |
        | VUXGYAN  | Kommunal vuxenutbildning som anpassad utbildning på gymnasial nivå |
        | VUXSFI   | Kommunal vuxenutbildning i svenska för invandrare |
        | YH       | Yrkeshögskola |
      enum:
        - AU
        - AUB
        - FHS
        - FKLASS
        - FTH
        - GR
        - GRAN
        - GY
        - GYAN
        - HS
        - KKU
        - KU
        - NY
        - OPPFTH
        - SAM
        - SP
        - STF
        - VUX
        - VUXGR
        - VUXGRAN
        - VUXGY
        - VUXGYAN
        - VUXSFI
        - YH
    Credits:
      required:
        - system
        - credits
      type: object
      properties:
        system:
          $ref: '#/components/schemas/Code_Credits'
        credits:
          type: number
          format: double
        min:
          type: number
          format: double
    DistanceEducation:
      type: object
      properties:
        noOfMandatorySessions:
          type: integer
          format: int32
        noOfOptionalSessions:
          type: integer
          format: int32
        noOfMandatoryRemoteSessions:
          type: integer
          format: int32
        noOfOptionalRemoteSessions:
          type: integer
          format: int32
        description:
          $ref: '#/components/schemas/LangString'
    EducationEvent:
      required:
        - identifier
        - education
        - providers
        - lastEdited
        - expires
        - execution
      type: object
      properties:
        identifier:
          type: string
        education:
          type: string
        providers:
          type: array
          minItems: 1
          items:
            type: string
        examiningBodies:
          type: array
          items:
            type: string
        orderers:
          type: array
          items:
            type: string
        lastEdited:
          type: string
          format: date-time-local
        expires:
          type: string
          format: date-time-local
        title:
          $ref: '#/components/schemas/LangString'
        description:
          $ref: '#/components/schemas/LangString'
        url:
          $ref: '#/components/schemas/LangUrl'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        languageOfInstructions:
          type: array
          items:
            type: string
        execution:
          $ref: '#/components/schemas/Execution'
        isCancelled:
          type: boolean
          nullable: true
        fees:
          type: array
          items:
            $ref: '#/components/schemas/Fee'
        places:
          type: integer
          format: int32
        timeOfStudy:
          $ref: '#/components/schemas/CodeTimeOfStudy'
        paceOfStudy:
          $ref: '#/components/schemas/PaceOfStudy'
        isApprenticeship:
          type: boolean
          nullable: true
        distance:
          $ref: '#/components/schemas/DistanceEducation'
        application:
          $ref: '#/components/schemas/Application'
        keywords:
          type: array
          items:
            $ref: '#/components/schemas/LangString'
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/Extension_E'
    EducationEventResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        content:
          $ref: '#/components/schemas/EducationEvent'
    EducationEventListResponse:
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        educationEvents:
          type: array
          items:
            $ref: '#/components/schemas/EducationEventResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'
    EducationInfo:
      required:
        - identifier
        - code
        - lastEdited
        - title
        - type
        - subject
        - resultIsDegree
      type: object
      properties:
        identifier:
          type: string
        educationBase:
          type: string
        code:
          type: string
        lastEdited:
          type: string
          format: date-time-local
        expires:
          type: string
          format: date-time-local
        title:
          $ref: '#/components/schemas/LangString'
        description:
          $ref: '#/components/schemas/LangString'
        url:
          $ref: '#/components/schemas/LangUrl'
        type:
          $ref: '#/components/schemas/Code_SchoolType'
        educationLevels:
          type: array
          items:
            $ref: '#/components/schemas/Code_EducationLevel'
        orientation:
          $ref: '#/components/schemas/Code_Orientation'
        audience:
          $ref: '#/components/schemas/Code_Audience'
        configuration:
          $ref: '#/components/schemas/Code_Configuration'
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/Code_Subject'
        isVocational:
          type: boolean
          nullable: true
        resultIsDegree:
          type: boolean
        degrees:
          $ref: '#/components/schemas/LangString'
        qualificationLevel:
          $ref: '#/components/schemas/Code_Qualification'
        credits:
          $ref: '#/components/schemas/Credits'
        extent:
          $ref: '#/components/schemas/TimeLength'
        eligibility:
          $ref: '#/components/schemas/LangString'
        recommendedPriorKnowledge:
          $ref: '#/components/schemas/LangString'
        eligibleForStudentAid:
          $ref: '#/components/schemas/Code_StudentAid'
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/Extension_I'
    EducationInfoResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        content:
          $ref: '#/components/schemas/EducationInfo'
    EducationInfoListResponse:
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        educationInfos:
          type: array
          items:
            $ref: '#/components/schemas/EducationInfoResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'
    Code_EducationLevel:
      type: object
      required:
        - type
      properties:
        type:
          type: string
      discriminator:
        propertyName: type
        mapping:
          YH_EducationLevel: '#/components/schemas/YH_EducationLevel'
          C_EducationLevel: '#/components/schemas/C_EducationLevel'
          UH_EducationLevel: '#/components/schemas/UH_EducationLevel'
      oneOf:
        - $ref: '#/components/schemas/YH_EducationLevel'
        - $ref: '#/components/schemas/C_EducationLevel'
        - $ref: '#/components/schemas/UH_EducationLevel'
    YH_EducationLevel:
      type: object
      required:
        - type
        - code
      properties:
        type:
          type: string
        code:
          type: string
    C_EducationLevel:
      type: object
      required:
        - type
        - code
      properties:
        type:
          type: string
        code:
          $ref: '#/components/schemas/EducationLevelCode'
    UH_EducationLevel:
      type: object
      required:
        - type
        - code
      properties:
        type:
          type: string
        code:
          type: string
    EducationLevelCode:
      type: string
      enum:
        - ISCED_01
        - ISCED_02
        - ISCED_1
        - ISCED_2
        - ISCED_3
        - ISCED_4
        - ISCED_5
        - ISCED_6
        - ISCED_7
        - ISCED_8
    EducationProvider:
      required:
        - identifier
        - lastEdited
        - name
        - url
        - contactAddress
        - emailAddress
        - responsibleBody
      type: object
      properties:
        identifier:
          type: string
        lastEdited:
          type: string
          format: date-time-local
        expires:
          type: string
          format: date-time-local
        name:
          $ref: '#/components/schemas/LangString'
        description:
          $ref: '#/components/schemas/LangString'
        url:
          $ref: '#/components/schemas/LangUrl'
        visitAddresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        contactAddress:
          $ref: '#/components/schemas/Address'
        emailAddresses:
          type: array
          minItems: 1
          items:
            type: string
            format: email
        phones:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumber'
        responsibleBody:
          $ref: '#/components/schemas/ResponsibleBody'
        years:
          type: array
          items:
            $ref: '#/components/schemas/Code_SchoolYear'
        owner:
          $ref: '#/components/schemas/LangString'
        organisationNumber:
          type: string
    EducationProviderResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        content:
          $ref: '#/components/schemas/EducationProvider'
    EducationProviderListResponse:
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        educationProviders:
          type: array
          items:
            $ref: '#/components/schemas/EducationProviderResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'
    Code_StudentAid:
      type: object
      required:
        - type
      properties:
        type:
          type: string
      discriminator:
        propertyName: type
        mapping:
          C_StudentAid: '#/components/schemas/C_StudentAid'
      oneOf:
        - $ref: '#/components/schemas/C_StudentAid'
    C_StudentAid:
      type: object
      required:
        - type
        - code
      properties:
        type:
          type: string
        code:
          $ref: '#/components/schemas/StudentAidCode'
    StudentAidCode:
      type: string
      enum:
        - saknas
        - nej
        - ja
        - "A 1"
        - "A 1 gr"
        - "A 1 gy"
        - "A 2"
        - "A 3"
        - "B 1"
        - "B 2"
    Execution:
      required:
        - condition
      type: object
      properties:
        condition:
          $ref: '#/components/schemas/Code_ExecutionCondition'
        start:
          type: string
          format: date
        end:
          type: string
          format: date
    Extension_E:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string
      discriminator:
        propertyName: type
        mapping:
          KVEventExtension: '#/components/schemas/KVEventExtension'
          UHEventExtension: '#/components/schemas/UHEventExtension'
      oneOf:
        - $ref: '#/components/schemas/KVEventExtension'
        - $ref: '#/components/schemas/UHEventExtension'
    KVEventExtension:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string
        contractor:
          type: string
    UHEventExtension:
      type: object
      required:
        - type
        - id
        - startPeriod
      properties:
        type:
          type: string
        id:
          type: string
        applicationDetails:
          $ref: '#/components/schemas/ApplicationDetailsType'
        admissionDetails:
          $ref: '#/components/schemas/AdmissionDetailsType'
        startPeriod:
          $ref: '#/components/schemas/StartDateType'
        stopWeek:
